# Standalone V2 ingress. Internal listener and Storage have no public route.
pid /tmp/v2-nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_max_body_size 0; # Transfer counts actual bytes against session policy.
    client_body_buffer_size 256k;
    client_body_timeout 125s;
    send_timeout 125s;
    upstream v2_api { server api:8080; }
    upstream v2_transfer { server transfer:8080; }
    server {
        listen 8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off; # Never replay a partially consumed mutation.
        proxy_connect_timeout 5s;
        proxy_send_timeout 125s;
        proxy_read_timeout 125s;

        location ~ ^/api/v2/uploads/[^/]+/parts/[0-9]+$ {
            proxy_pass http://v2_transfer;
        }
        location ~ ^/api/v2/files/[^/]+/download$ {
            proxy_pass http://v2_transfer;
        }
        location /api/v2/ {
            proxy_pass http://v2_api;
        }
        location / { return 404; }
    }
}
