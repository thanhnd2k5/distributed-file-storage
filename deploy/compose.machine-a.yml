name: dfs-machine-a

# Machine A demo: React (host) + Metadata + PostgreSQL + Storage Node 1.
# Node-2/3 chạy trên Machine B; Metadata gọi chúng qua LAN IP (MACHINE_B_HOST).
# Không tự khởi động container trên máy B.

x-python: &python
  build:
    context: ..
    dockerfile: deploy/Dockerfile.python
    target: runtime
  image: dfs-python:demo
  init: true
  restart: unless-stopped

x-storage-env: &storage-env
  FAILURE_DOMAIN: machine_A
  GRPC_BIND_HOST: 0.0.0.0
  DATA_DIR: /data/chunks
  CHUNK_SIZE_BYTES: "2097152"
  GRPC_MAX_MESSAGE_BYTES: "8388608"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-storage-health: &storage-health
  test: ["CMD", "python", "scripts/check_storage.py"]
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dfs}
      POSTGRES_USER: ${POSTGRES_USER:-dfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy deploy/.env.machine-a.example to deploy/.env.machine-a}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  metadata:
    <<: *python
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn metadata.main:create_app --factory --host 0.0.0.0 --port 8000 --workers 1 --timeout-keep-alive 300"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dfs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dfs}
      STORAGE_NODES_JSON: '[{"node_id":"node-1","host":"storage-node-1","port":50051,"failure_domain":"machine_A"},{"node_id":"node-2","host":"${MACHINE_B_HOST}","port":50052,"failure_domain":"machine_B"},{"node_id":"node-3","host":"${MACHINE_B_HOST}","port":50053,"failure_domain":"machine_B"}]'
      DOWNLOAD_TEMP_DIR: /tmp/dfs-downloads
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179"]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${METADATA_BIND:-0.0.0.0}:${METADATA_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  storage-node-1:
    <<: *python
    environment:
      <<: *storage-env
      NODE_ID: node-1
      GRPC_PORT: "50051"
    ports:
      - "${NODE_1_BIND:-127.0.0.1}:${NODE_1_PORT:-50051}:50051"
    volumes:
      - node-1-data:/data/chunks
    healthcheck: *storage-health

volumes:
  postgres-data:
  node-1-data:
