# Isolated V2 PostgreSQL fixture. No Windows host port and no V1 data volume.
name: dfs-v2-tests

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: v2_test
      POSTGRES_PASSWORD: v2_test_local_only
      POSTGRES_DB: dfs_v2_test
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v2_test -d dfs_v2_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: "no"

  tests:
    image: dfs-python-tests:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
      target: development
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://v2_test:v2_test_local_only@postgres:5432/dfs_v2_test
      V2_DATABASE_URL: postgresql+psycopg://v2_test:v2_test_local_only@postgres:5432/dfs_v2_test
      V2_NAMESPACE_ID: 63f6cf3b-d9a4-40fc-8e67-c86a05520d4c
      V2_RECOVERY_EPOCH: 81efbf3d-2768-44be-9de6-924c16606115
    restart: "no"

networks:
  default:
    internal: true
