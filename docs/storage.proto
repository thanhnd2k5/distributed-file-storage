syntax = "proto3";

package dfs.storage.v1;

// V1 uses unary RPC only. Semantic validation is specified in API_CONTRACTS.md.
service StorageService {
  rpc StoreChunk(StoreChunkRequest) returns (StoreChunkResponse);
  rpc GetChunk(GetChunkRequest) returns (GetChunkResponse);
  rpc DeleteChunk(DeleteChunkRequest) returns (DeleteChunkResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message StoreChunkRequest {
  string chunk_id = 1;       // Canonical lowercase UUID, generated by Metadata.
  bytes data = 2;
  string checksum_sha256 = 3; // Lowercase 64-character hex, SHA-256(data).
}

message StoreChunkResponse {
  string chunk_id = 1;
  uint64 size_bytes = 2;
  string checksum_sha256 = 3;
  bool already_existed = 4;
}

message GetChunkRequest {
  string chunk_id = 1;
}

message GetChunkResponse {
  string chunk_id = 1;
  bytes data = 2;
  string checksum_sha256 = 3; // Node computes from the bytes returned.
}

message DeleteChunkRequest {
  string chunk_id = 1;
}

message DeleteChunkResponse {
  string chunk_id = 1;
  bool existed = 2;          // False is successful idempotent deletion.
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string node_id = 1;
  string failure_domain = 2;
  bool storage_writable = 3;
  uint64 capacity_bytes = 4; // Filesystem size; may include other host files.
  uint64 available_bytes = 5; // Filesystem free space, not reserved capacity.
  uint64 used_bytes = 6;     // Committed chunk bytes in this node's directory.
}
